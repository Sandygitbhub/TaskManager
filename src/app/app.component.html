<div class="container-fluid py-5">
  <!-- Header -->
  <div class="row justify-content-center mb-5">
    <div class="col-md-8 text-center">
      <h1 class="display-4 text-white mb-3">
        <i class="bi bi-check-circle-fill me-3"></i>{{ title }}
      </h1>
      <p class="lead text-white-50">Organize your tasks efficiently</p>
    </div>
  </div>

  <!-- Menu -->
  <div class="row justify-content-center mb-5">
    <div class="col-md-10">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card bg-white text-center h-100" routerLink="/create" style="cursor: pointer;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center p-5">
              <i class="bi bi-plus-circle-fill display-1 text-primary mb-4"></i>
              <h3 class="card-title text-primary">Create Task</h3>
              <p class="card-text text-muted">Add a new task to your list</p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card bg-white text-center h-100" routerLink="/view" style="cursor: pointer;">
            <div class="card-body d-flex flex-column justify-content-center align-items-center p-5">
              <i class="bi bi-list-check display-1 text-success mb-4"></i>
              <h3 class="card-title text-success">View Tasks</h3>
              <p class="card-text text-muted">Browse and manage your tasks</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
<app-toast></app-toast>
