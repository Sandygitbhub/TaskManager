<div class="list-group-item d-flex justify-content-between align-items-center p-3" [class.task-completed]="task.completed">
  <div class="d-flex align-items-center flex-grow-1">
    <div class="form-check me-3">
      <input class="form-check-input" type="checkbox" [id]="'task-' + task.id" [checked]="task.completed" (change)="onToggle()">
    </div>
    <div class="flex-grow-1">
      <h6 class="mb-1 task-title fw-bold" [class.text-decoration-line-through]="task.completed">
        <i class="bi" [class]="task.completed ? 'bi-check-circle-fill text-success me-2' : 'bi-circle me-2 text-muted'"></i>
        {{ task.title }}
      </h6>
      <p class="mb-0 text-muted small">{{ task.description }}</p>
    </div>
  </div>
  <button class="btn btn-outline-danger ms-3" (click)="onDelete()" title="Delete task">
    <i class="bi bi-trash-fill"></i> Delete
  </button>
</div>
