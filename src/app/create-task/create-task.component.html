<div class="container-fluid py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card bg-white">
        <div class="card-body p-4">
          <h5 class="card-title text-primary mb-4">
            <i class="bi bi-plus-circle-fill me-2"></i>Add New Task
          </h5>
          <form (ngSubmit)="addTask()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="title" class="form-label fw-bold">
                  <i class="bi bi-tag-fill me-1"></i>Title
                </label>
                <input type="text" class="form-control" id="title" [(ngModel)]="newTitle" name="title" placeholder="Enter task title..." required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="description" class="form-label fw-bold">
                  <i class="bi bi-card-text me-1"></i>Description
                </label>
                <textarea class="form-control" id="description" rows="2" [(ngModel)]="newDescription" name="description" placeholder="Enter task description..."></textarea>
              </div>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary btn-lg px-5">
                <i class="bi bi-plus-lg me-2"></i>Add Task
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
